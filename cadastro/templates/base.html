<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sistema Escolar e Produtos{% endblock %}</title>
    <style>
        /* Estilos simples para deixar a página organizada */
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 30px auto;
            padding: 0 16px;
            background-color: #f9f9f9;
            color: #222;
        }
        nav {
            background-color: #2c3e50;
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 24px;
        }
        nav a {
            color: #fff;
            text-decoration: none;
            margin-right: 16px;
            font-weight: bold;
        }
        nav a:hover {
            text-decoration: underline;
        }
        .card {
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 16px;
            margin-bottom: 14px;
        }
        .vazio {
            color: #666;
            font-style: italic;
        }
        form p {
            margin-bottom: 12px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 4px;
        }
        input, textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #2c3e50;
            color: #fff;
            border: none;
            padding: 10px 18px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #1a252f;
        }
    </style>
</head>
<body>
    <!-- Barra de navegação principal -->
    <nav>
        <a href="{% url 'listar_alunos' %}">Alunos</a>
        <a href="{% url 'listar_cursos' %}">Cursos</a>
        <a href="{% url 'listar_produtos' %}">Produtos</a>
        <a href="{% url 'produto_new' %}">Novo Produto</a>
        <a href="/admin/">Admin</a>
    </nav>

    <!-- Bloco principal onde cada página insere seu conteúdo -->
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
