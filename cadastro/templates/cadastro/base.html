<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sistema Escolar - EA 1{% endblock %}</title>
    <style>
        /* Estilos simples para deixar a página organizada */
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 30px auto;
            padding: 0 16px;
            background-color: #f9f9f9;
            color: #222;
        }
        nav {
            background-color: #2c3e50;
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 24px;
        }
        nav a {
            color: #fff;
            text-decoration: none;
            margin-right: 16px;
            font-weight: bold;
        }
        nav a:hover {
            text-decoration: underline;
        }
        .card {
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 16px;
            margin-bottom: 14px;
        }
        .vazio {
            color: #666;
            font-style: italic;
        }
    </style>
</head>
<body>
    <!-- Barra de navegação principal -->
    <nav>
        <a href="{% url 'listar_alunos' %}">Alunos</a>
        <a href="{% url 'listar_cursos' %}">Cursos</a>
        <a href="/admin/">Admin</a>
    </nav>

    <!-- Conteúdo específico de cada página -->
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
